<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="coherence-api-base" content="">
<title>Compass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: top bar + header with five page tabs (hash-routed); each tab is one screen of cards on a light grey ground.
   Values follow the "Coherence dashboard" reference: navy ink, red brand square, green/red/amber pillar states. */
:root{
  --ink:#14233A; --navy:#0B2A4A; --muted:#46546B; --soft:#6B778A;
  --bg:#F4F5F7; --surface:#FFFFFF; --line:#DDE1E7; --line-2:#ECEFF3; --tint:#F7F8FA;
  --red:#E41C23; --red-ink:#C4161C; --red-bg:#FDECEC;
  --ok:#1E7B3A; --ok-bg:#E8F5EC; --warn:#9A5B00; --warn-bg:#FFF4DE; --info:#1F5FA8; --info-bg:#EAF2FB;
  --unk:#5E6B7A; --band:rgba(66,88,101,.13); --band-2:rgba(66,88,101,.22);
  --f:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 1px 2px rgba(20,35,58,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6ECF3; --navy:#DCE7F3; --muted:#A6B2C2; --soft:#8E9BAD;
  --bg:#0D141C; --surface:#151F2A; --line:#283545; --line-2:#1F2A37; --tint:#1A2532;
  --red:#FF4B52; --red-ink:#FF7A7F; --red-bg:#3A1619;
  --ok:#5FD08A; --ok-bg:#12301E; --warn:#F2B54A; --warn-bg:#382A10; --info:#8CC2F2; --info-bg:#16283A;
  --unk:#A9B5C2; --band:rgba(220,231,243,.10); --band-2:rgba(220,231,243,.18); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --ink:#E6ECF3; --navy:#DCE7F3; --muted:#A6B2C2; --soft:#8E9BAD;
  --bg:#0D141C; --surface:#151F2A; --line:#283545; --line-2:#1F2A37; --tint:#1A2532;
  --red:#FF4B52; --red-ink:#FF7A7F; --red-bg:#3A1619;
  --ok:#5FD08A; --ok-bg:#12301E; --warn:#F2B54A; --warn-bg:#382A10; --info:#8CC2F2; --info-bg:#16283A;
  --unk:#A9B5C2; --band:rgba(220,231,243,.10); --band-2:rgba(220,231,243,.18); --shadow:0 1px 2px rgba(0,0,0,.4);
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--f)}
a{color:var(--navy)} a:hover{color:var(--red-ink)}
button{font:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto}
.top{background:#0B2A4A;color:#fff;font-size:13px}
.top .wrap{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:center;padding-block:8px}
.top a{color:#fff}
.hdr{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.hdr .wrap{display:flex;flex-wrap:wrap;gap:8px 32px;align-items:center;justify-content:space-between;padding-block:6px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;color:var(--navy);letter-spacing:-.01em}
.brand i{width:30px;height:30px;background:var(--red);border-radius:4px}
.left{display:flex;flex-wrap:wrap;align-items:center;gap:4px 36px}
nav.pages{display:flex;flex-wrap:wrap;gap:0 26px;font-weight:600;font-size:15px}
nav.pages a{color:var(--muted);text-decoration:none;padding:14px 0 11px;border-bottom:3px solid transparent;display:inline-flex;gap:6px;align-items:center}
nav.pages a[aria-current="page"]{color:var(--navy);border-color:var(--red)}
nav.pages a .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select,.btn{border-radius:4px;min-height:40px;font-weight:600;font-size:14px}
select{border:1px solid var(--navy);background:var(--surface);color:var(--navy);padding:8px 12px;max-width:100%}
.btn{border:1px solid var(--navy);background:transparent;color:var(--navy);padding:8px 14px;cursor:pointer}
main{padding-block:28px 56px}
.page{display:flex;flex-direction:column;gap:20px}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red-ink)}
h1,h2,h3{color:var(--navy);margin:0;text-wrap:balance}
h1{font-size:32px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
h2{font-size:22px;font-weight:800}
h3{font-size:17px;font-weight:700}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
.half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:920px){.grid2,.half{grid-template-columns:1fr}}

/* profile strip */
.strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) auto;gap:16px;align-items:center}
@media (max-width:920px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kv span{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.kv b{font-weight:600;font-size:15px;color:var(--ink)}

/* states */
.st{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap}
.st::before{font-weight:800}
.s-violation{background:var(--red-bg);color:var(--red-ink)} .s-violation::before{content:"✕"}
.s-warning{background:var(--warn-bg);color:var(--warn)} .s-warning::before{content:"⚠"}
.s-pass{background:var(--ok-bg);color:var(--ok)} .s-pass::before{content:"✓"}
.s-info{background:var(--info-bg);color:var(--info)} .s-info::before{content:"i"}
.s-unknown{background:transparent;color:var(--unk);border:1px dashed var(--unk)} .s-unknown::before{content:"?"}
.c-violation{--c:var(--red)} .c-warning{--c:var(--warn)} .c-pass{--c:var(--ok)} .c-unknown{--c:var(--unk)} .c-info{--c:var(--info)}
.tx-violation{color:var(--red-ink)} .tx-warning{color:var(--warn)} .tx-pass{color:var(--ok)} .tx-unknown{color:var(--unk)} .tx-info{color:var(--info)}

/* summary */
.exec{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:28px}
@media (max-width:920px){.exec{grid-template-columns:1fr}}
.exec .lead{font-size:17px;line-height:1.6}
.qbox{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.qbox .q{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
.qbox .a{font-weight:800;font-size:17px;display:flex;gap:8px;align-items:center}
.actions{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px}
.primary{background:var(--navy);color:var(--surface);border:0;border-radius:4px;padding:11px 18px;font-weight:700;cursor:pointer;min-height:44px}
.link{background:none;border:0;padding:0;color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer}
.pillars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
@media (max-width:1100px){.pillars{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.pillars{grid-template-columns:1fr}}
.pillar{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:6px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);color:var(--ink)}
.pillar:hover{border-color:var(--c)}
.pillar .n{font-size:13px;color:var(--muted)} .pillar .v{font-weight:800;font-size:17px} .pillar .d{font-size:13px;color:var(--muted)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--f)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:16px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
@media (max-width:520px){.scen{grid-template-columns:1fr}}
.scen div{background:var(--tint);border-radius:6px;padding:12px 14px}
.scen span{display:block;font-size:13px;color:var(--muted)} .scen b{font-size:20px;font-weight:800}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin-top:14px}
.keys span{display:block;font-size:13px;color:var(--muted)} .keys b{font-size:22px;font-weight:800;color:var(--navy)}
.allocbar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:10px 0 14px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line-2);vertical-align:top} td.r,th.r{text-align:right;white-space:nowrap}
tr.flag td{background:var(--red-bg)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px;vertical-align:0}
.tbl{overflow-x:auto}

/* factor sub-tabs */
.ftabs{display:flex;gap:8px;flex-wrap:wrap}
.ftabs button{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer;color:var(--navy);font-weight:600;font-size:14px}
.ftabs button[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.ftabs .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.expo{--x-direct:#2a78d6;--x-etf:#1baf7a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .expo{--x-direct:#3987e5;--x-etf:#199e70}}
:root[data-theme="dark"] .expo{--x-direct:#3987e5;--x-etf:#199e70}
.expo .xrow{border-top:1px solid var(--line-2)} .expo .xrow:first-of-type{border-top:0}
.expo summary{display:grid;grid-template-columns:minmax(120px,1.1fr) 2fr 64px 92px;gap:12px;align-items:center;padding:9px 2px;cursor:pointer;list-style:none}
.expo summary::-webkit-details-marker{display:none}
.expo summary .nm::before{content:"▸ ";color:var(--soft)} .expo details[open] summary .nm::before{content:"▾ "}
.expo .bar{display:flex;gap:2px;height:12px;align-items:stretch}
.expo .bar i{display:block;min-width:2px}
.expo .bar i:first-child{border-radius:4px 0 0 4px} .expo .bar i:last-child{border-radius:0 4px 4px 0} .expo .bar i:only-child{border-radius:4px}
.expo .seg-direct{background:var(--x-direct)}
.expo .seg-etf{background:var(--x-etf) repeating-linear-gradient(45deg,transparent 0 3px,rgba(255,255,255,.35) 3px 5px)}
.expo .num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)} .expo .num.c{color:var(--muted);font-size:13px}
.expo .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.expo .legend span{display:inline-flex;gap:6px;align-items:center} .expo .legend i{width:14px;height:10px;border-radius:2px;display:inline-block}
.expo .parts{margin:0 0 10px 18px} .expo .parts td,.expo .parts th{padding:4px 8px;font-size:13px}
@media (max-width:640px){.expo summary{grid-template-columns:1fr 64px 80px}.expo summary .bar{grid-column:1/-1;order:4}}
.rule{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line-2);align-items:start}
.rule .ic{font-weight:800;line-height:1.5}
.rule b{font-weight:700} .rule .v{text-align:right;white-space:nowrap;font-weight:700;font-variant-numeric:tabular-nums}
.rule .v small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.rule .id{font-family:var(--mono);font-size:11px;color:var(--soft);margin-left:6px}
@media (max-width:560px){.rule{grid-template-columns:24px minmax(0,1fr)}.rule .v{grid-column:2;text-align:left}}
.meter{margin:6px 0 2px} .meter .row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;gap:12px}
.meter .bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden;margin:6px 0 10px}
.meter .bar div{height:100%;border-radius:4px}
dl.facts{margin:0;display:flex;flex-direction:column}
dl.facts div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:14px}
dl.facts dt{color:var(--muted)} dl.facts dt small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft)}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere} dl.facts dd .by{display:block;font:500 11px var(--mono);color:var(--soft)}
.segs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.segs li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px}
.kind{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor;border-radius:3px;padding:2px 6px;align-self:start;text-align:center}
.k-fact{color:var(--navy)} .k-assumption{color:var(--info)} .k-inference{color:var(--warn)} .k-unknown{color:var(--unk);border-style:dashed}
.refs{display:block;font:500 11px var(--mono);color:var(--soft);margin-top:3px;overflow-wrap:anywhere}
.mode{font:500 11.5px var(--mono);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 9px;white-space:nowrap}
.note{border-left:3px solid var(--red);padding:4px 0 4px 12px;color:var(--muted);font-size:14px}

/* profile coherence */
.pcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.pcc{border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.pcc.warning{background:var(--warn-bg);border-color:var(--warn)} .pcc.info{background:var(--info-bg);border-color:var(--info)}
.pcc .t{font-size:12px;font-weight:800;letter-spacing:.04em}
.pcc .vs{font-size:14px} .pcc .vs b{color:var(--navy)}
.pcc .ask{font-size:14px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.src{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:860px){.src{grid-template-columns:1fr}}
.src ul{margin:8px 0 0;padding-left:18px;font-size:14px;color:var(--muted)} .src li{margin:5px 0}

/* search and ask */
.ask{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.ask{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;gap:14px}
.msgs{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto}
.msg{border-radius:6px;padding:10px 14px;font-size:14.5px;max-width:92%}
.msg.user{background:var(--navy);color:var(--surface);align-self:flex-end}
.msg.agent{background:var(--tint);align-self:flex-start}
.msg.agent.refuse{background:var(--warn-bg);border:1px solid var(--warn)}
.msg .who{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:3px}
.msg.refuse .who{color:var(--warn)}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer}
.askf{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.askf label{font-size:13px;font-weight:700}
.askf div{display:flex;gap:8px}
.askf input{flex:1;min-width:0;border:1px solid var(--muted);border-radius:4px;padding:9px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.send,.cta{background:var(--red);color:#fff;border:0;border-radius:4px;padding:9px 16px;font-weight:700;cursor:pointer;min-height:40px}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--line);border-radius:4px;padding:5px 8px 5px 10px;font-size:13px;font-weight:600}
.fchip button{background:none;border:0;cursor:pointer;color:var(--muted);font-weight:800;padding:0 2px}
#addf{border:1px dashed var(--muted);min-height:32px;padding:4px 8px;font-size:13px}
table.assets td{vertical-align:middle} table.assets tr.on td{background:var(--info-bg)}
table.assets input{width:18px;height:18px;accent-color:var(--navy)}
.selbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--tint);border-radius:6px;padding:12px 14px;margin-top:14px}
/* what-if */
.atabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.atabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);cursor:pointer;margin-bottom:-1px}
.atabs button[aria-selected="true"]{color:var(--navy);border-color:var(--red);background:var(--surface)}
.scen-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;align-items:end}
@media (max-width:920px){.scen-bar{grid-template-columns:1fr 1fr}} @media (max-width:520px){.scen-bar{grid-template-columns:1fr}}
.scen-bar label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.scen-bar select{width:100%}
/* SPEC §12 / P2 blocks: derived_from chain, assumption badge, unknowns, values rules, limitations */
[data-check]{cursor:pointer} [data-check]:hover{background:var(--tint)}
[hidden]{display:none !important}
.chainslot{background:var(--tint);border-radius:6px;padding:10px 14px;margin:2px 0 10px;cursor:default}
.chainlist{margin:6px 0 0;padding-left:20px;font-size:13px} .chainlist li{margin:3px 0}
.chainlist .mono{color:var(--soft);margin-left:6px}
details.abadge{display:inline-block;max-width:100%;vertical-align:top;margin:4px 0}
details.abadge summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--info);display:inline-flex;gap:8px;align-items:center}
details.abadge ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--muted)} details.abadge li{margin:4px 0}
.unklist,.vrules,.limits ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.unkrow{padding:8px 6px;border-top:1px solid var(--line-2);font-size:14px}
.vr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px 0;border-top:1px solid var(--line-2);align-items:center}
.vr .q{font-weight:600} .vr .acts{display:flex;gap:8px;flex-wrap:wrap}
.vr .btn{min-height:32px;padding:4px 12px;font-size:13px} .vr .btn[disabled]{opacity:.55;cursor:not-allowed}
@media (max-width:560px){.vr{grid-template-columns:1fr}}
.limits li{padding:8px 0;border-top:1px solid var(--line-2);font-size:14px}
.limits li ul{margin:4px 0 0;padding-left:18px;list-style:disc;font-size:13px;color:var(--muted)}
.lt{border-left:4px solid var(--unk)}
/* Flow B (SPEC §4 B2): intent confirmation form, status line, error banner */
.ifm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 18px;margin-top:14px;align-items:end}
.ifm label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);margin-bottom:4px}
.ifm input,.ifm select,.ifm textarea{width:100%;border:1px solid var(--muted);border-radius:4px;padding:9px 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink);min-height:40px}
.ifm .full{grid-column:1/-1}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:8px}
.errbar{border-left:4px solid var(--red);background:var(--red-bg);color:var(--red-ink);padding:10px 14px;border-radius:4px;font-weight:600}
.primary[disabled]{opacity:.45;cursor:not-allowed}
footer{border-top:1px solid var(--line);padding-block:22px 40px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="top gut"><div class="wrap">
  <span>ⓘ Simulation seulement. Profils et portefeuilles fictifs, pas un conseil financier personnalisé.</span>
  <span><a href="#sources">Sources et hypothèses</a> · <a href="design.html">Écrans v2</a></span>
</div></div>
<header class="hdr gut"><div class="wrap">
  <div class="left">
    <div class="brand"><i aria-hidden="true"></i>Compass</div>
    <nav class="pages" aria-label="Pages" id="pages"></nav>
  </div>
  <div class="tools">
    <select id="pick" aria-label="Rapport"></select>
    <button class="btn" id="theme" type="button" aria-label="Basculer le mode sombre">◐</button>
  </div>
</div></header>
<main class="gut"><div class="wrap" id="app"><p class="sub">Chargement du rapport…</p></div></main>
<footer class="gut"><div class="wrap" id="foot"></div></footer>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const nb = s => s.replace(/ | /g, " ");
  const pct = (x, d = 1) => (x * 100).toFixed(d).replace(".", ",").replace("-", "−") + " %";
  const cad = x => nb(new Intl.NumberFormat("fr-CA", {maximumFractionDigits: 0}).format(x)) + " $";
  const kcad = x => Math.round(x / 1000) + " k$";
  const RANK = {violation: 4, warning: 3, unknown: 2, info: 1, pass: 0};
  const ICON = {violation: "✕", warning: "⚠", unknown: "?", info: "i", pass: "✓"};
  const PILLAR = {violation: "Hors limites", warning: "Avertissement", unknown: "À vérifier", info: "Info", pass: "Aligné"};
  const CHECK_ST = {violation: "Hors limite", warning: "Avertissement", unknown: "Non vérifiable", info: "Info", pass: "Respecté"};
  const st = (s, label) => `<span class="st s-${s}">${esc(label || CHECK_ST[s])}</span>`;
  const LVL = {low: "faible", low_moderate: "faible à modéré", moderate: "modéré", moderate_high: "modéré à élevé", high: "élevé"};
  const STAGE = {pre_retirement: "préretraite", retirement: "retraite", accumulation: "accumulation"};
  const OBJ = {capital_preservation_with_growth: "Préserver le capital, un peu de croissance", capital_preservation: "Préserver le capital", growth: "Croissance", income: "Revenu", aggressive_growth: "Croissance soutenue"};
  const VERDICT = {incoherent: "Non cohérent", coherent: "Cohérent", coherent_with_warnings: "Cohérent, avec avertissements"};
  const CHECK = {
    H1: ["Aucun type d'actif refusé", "Types que vous refusez"], H2: ["Cryptoactifs sous le plafond", "Selon votre risque"],
    H3: ["Aucun titre au-dessus du plafond", "Poids d'un seul titre"], H4: ["Revenu fixe minimum", "Part en obligations"],
    H5: ["Devises étrangères sous le plafond", "Part hors CAD"], H6: ["Exposition au secteur de votre employeur", "Concentration avec votre emploi"],
    H7: ["Volatilité dans votre bande", "Fixée par votre risque effectif"], H8: ["Repli historique sous votre maximum", "Le repli que vous acceptez"],
    H9: ["Valeur pessimiste au-dessus du plancher", "90 % de la valeur au premier retrait"], H10: ["Part du risque d'un secteur", "Contribution au risque total"],
    H11: ["Activités exclues", "Vos exclusions approuvées"], H12: ["Frais (RFG)", "Plafond déclaré"], H13: ["Thème plafonné", "Vos règles approuvées"],
    H14: ["Réaction déclarée à une baisse de 20 %", "Comparée au repli historique"], S2: ["Connaissances et complexité", "Produits complexes détenus"],
    S4: ["Rappel de vos notes", "Règle non approuvée"],
  };
  const FIELD = {
    "objectives.horizon_years": "Horizon déclaré", "objectives.effective_horizon_years": "Horizon effectif", "objectives.primary": "Objectif principal",
    "objectives.secondary": "Objectifs secondaires", "objectives.goals": "Objectifs", "situation.planned_withdrawals": "Retraits prévus",
    "identity.retirement_target_age": "Âge de retraite visé", "risk.declared": "Risque déclaré", "risk.capacity": "Capacité de risque",
    "risk.effective": "Risque effectif", "risk.behavioural": "Comportement observé", "risk.max_acceptable_drawdown_pct": "Repli maximal accepté",
    "risk.reaction_to_20pct_drop": "Réaction à une baisse de 20 %", "situation.emergency_fund_months": "Fonds d'urgence (mois)",
    "situation.income_stability": "Stabilité du revenu", "identity.employer_sector": "Secteur de l'employeur",
    "preferences.asset_types_refused": "Types d'actifs refusés", "preferences.max_fee_mer_pct": "RFG maximal", "values.notes": "Vos notes",
    "preferences.interests": "Intérêts", "values.parsed_notes": "Règles tirées de vos notes",
    "values.parsed_notes.value.params.max_pct": "Part maximale d'un thème de vos notes",
  };
  const fieldName = p => FIELD[p] || FIELD[p.replace(/\[\d+\]/g, "").replace(/\.date$/, "")] || p;
  const UNIT = {weight: pct, risk_share: pct, annual_vol: pct, drawdown: pct, cad, score: x => String(Math.round(x))};
  const fv = (c, v) => v == null ? "—" : (UNIT[c.unit] || String)(v);
  const show = v => v == null ? "—" : Array.isArray(v) ? v.map(show).join(" · ")
    : typeof v === "object" ? Object.entries(v).map(([k, x]) => `${k}: ${show(x)}`).join(", ") : (LVL[v] || STAGE[v] || OBJ[v] || String(v));
  const KIND = {fact: "fait", assumption: "hypothèse", inference: "inférence", unknown: "inconnu"};
  const PAGES = [["synthese", "Synthèse"], ["facteurs", "Facteurs"], ["profil", "Profil"], ["portefeuille", "Portefeuille"], ["recherche", "Recherche"], ["simulation", "Simulation"], ["sources", "Sources"]];
  const state = {rep: null, page: "synthese", factor: null, error: "", draft: null, intake: null, onboarding: null, creating: false, profiles: []};

  /* Flow B reports carry the checks of the trade (`checks_proposed`) next to today's: the sections and the verdict follow the trade. */
  const shownChecks = rep => rep.checks_proposed || rep.checks_current;
  const checksOf = (rep, f) => shownChecks(rep).filter(c => c.factor === f).sort((a, b) => RANK[b.status] - RANK[a.status]);
  const worst = (rep, f) => checksOf(rep, f)[0];
  function pillarLine(rep, s) {
    const cs = checksOf(rep, s.factor), bad = cs.filter(c => c.status === "violation" || c.status === "warning");
    if (!cs.length) return s.not_covered && s.not_covered.length ? "Pas encore mesuré" : "Aucune vérification chiffrée";
    if (bad.length) { const c = bad[0]; return `${c.id}${c.subject ? " " + c.subject : ""} : ${fv(c, c.value)} pour une limite de ${fv(c, c.limit)}${bad.length > 1 ? ` · ${bad.length - 1} autre${bad.length > 2 ? "s" : ""}` : ""}`; }
    const unk = cs.filter(c => c.status === "unknown").length;
    return unk ? `${cs.length - unk} sur ${cs.length} vérifiées, ${unk} non vérifiable${unk > 1 ? "s" : ""}` : `${cs.length} vérification${cs.length > 1 ? "s" : ""} respectée${cs.length > 1 ? "s" : ""}`;
  }

  /* ---------- SPEC §12 / P2 renderers: every figure shown is read from the report JSON ---------- */
  function segmentTag(g) {
    const kind = KIND[g.kind] ? g.kind : "unknown";
    return `<span class="kind k-${kind}" title="${esc(g.kind)}">${KIND[kind]}</span>`;
  }
  function assumptionBadge(items, label) {
    const list = (items || []).filter(Boolean);
    if (!list.length) return "";
    return `<details class="abadge"><summary><span class="kind k-assumption">${KIND.assumption}</span>${esc(label)}<span class="small">(${list.length})</span></summary><ul>${list.map(a => `<li>${esc(a)}</li>`).join("")}</ul></details>`;
  }
  function renderDerivedFrom(c) {
    const chain = c.derived_from || [];
    return `<div class="chain"><p class="small"><b>D'où vient ce contrôle</b> (derived_from)${c.source ? ` · source <span class="mono">${esc(c.source)}</span>` : ""}${c.message_key ? ` · <span class="mono">${esc(c.message_key)}</span>` : ""}</p>
      ${chain.length ? `<ol class="chainlist">${chain.map(f => `<li><span>${esc(fieldName(f) === f ? f : fieldName(f))}</span>${fieldName(f) === f ? "" : `<span class="mono">${esc(f)}</span>`}</li>`).join("")}</ol>` : `<p class="small">Aucune entrée déclarée.</p>`}</div>`;
  }
  function bindChecks(rep) {
    const src = {c: shownChecks(rep) || [], u: rep.unknowns || [], g: (rep.goals || {}).checks || []};
    document.querySelectorAll("[data-check]").forEach(row => {
      const toggle = () => {
        const [k, i] = row.dataset.check.split(":"), slot = document.getElementById(`chain-${k}-${i}`);
        if (!slot || !src[k] || !src[k][i]) return;
        const open = slot.hidden;
        if (open && !slot.dataset.filled) { (slot.firstElementChild && slot.tagName === "TR" ? slot.firstElementChild : slot).innerHTML = renderDerivedFrom(src[k][i]); slot.dataset.filled = "1"; }
        slot.hidden = !open; row.setAttribute("aria-expanded", String(open));
      };
      row.addEventListener("click", toggle);
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
    });
  }
  function renderStress(rep) {
    const s = rep.stress;
    if (!s) return "";
    const shocks = (s.facts || {}).scenarios || {};
    const label = sc => (shocks[sc.id] || {}).shock || (sc.shock_bp == null ? sc.id : `${sc.shock_bp} pb`);
    const rows = (s.scenarios || []).map(sc => `<tr><td>${esc(label(sc))}</td><td class="r">${sc.shock_bp == null ? "—" : (sc.shock_bp > 0 ? "+" : "") + sc.shock_bp}</td><td class="r"><b>${pct(sc.impact, 2)}</b></td><td class="r">${cad(sc.impact_cad)}</td></tr>`).join("");
    const dur = (s.bond_holdings || []).map(h => `${esc(h.ticker)} : ${esc(String(h.duration))} (${esc(h.duration_source)})`).join(" · ");
    const nm = s.not_modelled || {};
    return `<section class="card" id="stress"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3>Scénarios de taux d'intérêt</h3>${st(s.status)}</div>
      <p class="small" style="margin-top:6px">Une illustration de l'effet d'un choc de taux sur les FNB d'obligations, pas une prévision. Information seulement : ce n'est pas un contrôle, et cela ne change ni le verdict ni les limites.</p>
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Scénario</th><th class="r">Choc (pb)</th><th class="r">Effet sur la valeur</th><th class="r">Effet en dollars</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="small" style="margin-top:10px">${s.sourced ? "Durations sourcées." : "Durations non sourcées : valeurs supposées par l'équipe (ASSUMED)."}${dur ? ` Durations utilisées : ${dur}.` : ""}${nm.weight ? ` Non modélisé : ${pct(nm.weight, 0)} du portefeuille.` : ""}</p>
      ${assumptionBadge(s.assumptions, s.sourced ? " hypothèses du scénario " : " non sourcé : hypothèses du scénario ")}</section>`;
  }
  function renderGoals(rep) {
    const g = rep.goals;
    if (!g || !(g.checks || []).length) return "";
    const byName = new Map((g.goal_probs || []).map(p => [p.name, p]));
    const rows = g.checks.map((c, i) => { const p = byName.get(c.subject);
      return `<tr data-check="g:${i}" tabindex="0" role="button" aria-expanded="false"><td>${esc(c.subject)}</td><td>${esc(c.date)}</td><td class="r">${cad(p ? p.amount : c.amount)}</td><td class="r">${p ? `<b>${pct(p.prob, 1)}</b>` : `<span class="small">hors de l'horizon simulé</span>`}</td><td>${st(c.status)}</td></tr><tr id="chain-g-${i}" hidden><td colspan="5" class="chainslot"></td></tr>`; }).join("");
    return `<section class="card" id="goals"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3>Probabilité d'atteindre vos objectifs</h3><span class="small">horizon simulé : ${g.horizon_months} mois · contribution mensuelle déclarée : ${cad(g.monthly_contribution)}</span></div>
      <p class="small" style="margin-top:6px">Part des trajectoires simulées qui atteignent le montant à la date visée. Information seulement : jamais une violation, jamais dans le verdict.</p>
      <div class="tbl" style="margin-top:10px"><table><thead><tr><th>Objectif</th><th>Date</th><th class="r">Montant</th><th class="r">Probabilité</th><th>Statut</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${assumptionBadge(g.assumptions, " hypothèses de ces probabilités ")}</section>`;
  }
  /* D19: what the portfolio really holds, ETFs looked through (metrics_current.exposure). Descriptive only:
     no limit, no status here; the checks stay on the Facteurs page. */
  const XFR = {"Information Technology": "Technologies de l'information", "Communication Services": "Services de communication",
    "Consumer Discretionary": "Consommation discrétionnaire", "Consumer Staples": "Consommation de base", "Energy": "Énergie",
    "Financials": "Finance", "Health Care": "Santé", "Industrials": "Industrie", "Materials": "Matériaux",
    "Real Estate": "Immobilier", "Utilities": "Services publics", "Cash and other": "Liquidités et autres", "Bonds": "Obligations",
    "Gold": "Or", "Crypto asset": "Crypto", "Crypto": "Crypto", "Broad market (diversified)": "Marché large (non ventilé)",
    "Stocks": "Actions", "Equity ETFs": "FNB d'actions", "Canada": "Canada", "United States": "États-Unis",
    "Global (crypto)": "Mondial (crypto)", "Global (gold)": "Mondial (or)", "United Kingdom": "Royaume-Uni",
    "Netherlands": "Pays-Bas", "Switzerland": "Suisse", "Ireland": "Irlande", "Japan": "Japon", "Germany": "Allemagne",
    "France": "France", "China": "Chine", "Bermuda": "Bermudes", "Brazil": "Brésil", "Israel": "Israël", "Other": "Autres"};
  const xn = n => XFR[n] || n;
  const XTABS = [["sector", "Secteurs"], ["country", "Pays"], ["names", "Entreprises"], ["class", "Classes d'actifs"], ["currency", "Devises"]];
  function renderExposure(rep, m) {
    const e = (m || rep.metrics_current).exposure;
    if (!e) return "";
    const tab = XTABS.some(([k]) => k === state.expo) ? state.expo : "sector";
    const names = tab === "names", sn = e.single_names;
    // one shape for every tab: {name, weight, value_cad, direct, etf, parts: [{label, how, weight}]}
    const rows = names
      ? sn.rows.slice(0, 15).map(r => ({name: r.name + " (" + r.ticker + ")", weight: r.weight, value_cad: r.value_cad,
          direct: r.direct, etf: r.weight - r.direct,
          parts: [...(r.direct ? [{label: r.name, how: "détenu directement", weight: r.direct}] : []),
                  ...r.via.map(v => ({label: v.name + " (" + v.etf + ")", how: "via ce FNB", weight: v.weight}))]}))
      : e.dimensions[tab].rows.map(r => ({name: xn(r.name), weight: r.weight, value_cad: r.value_cad,
          direct: r.parts.filter(p => p.via === "direct").reduce((a, p) => a + p.weight, 0),
          etf: r.parts.filter(p => p.via === "etf").reduce((a, p) => a + p.weight, 0),
          parts: r.parts.map(p => ({label: p.name + " (" + p.ticker + ")", how: p.via === "etf" ? "via ce FNB" : "détenu directement", weight: p.weight}))}));
    const max = Math.max(...rows.map(r => r.weight), 0.0001);
    const seg = (cls, w, what, r) => w > 0.00005 ? `<i class="seg-${cls}" style="flex:0 0 calc(${(w / max * 100).toFixed(2)}% - 1px)" title="${esc(r.name)} · ${what} : ${pct(w)} (${cad(w * e.value_cad)})"></i>` : "";
    const list = rows.map(r => `<details class="xrow"><summary><span class="nm">${esc(r.name)}</span>
        <span class="bar" aria-hidden="true">${seg("direct", r.direct, "détenu directement", r)}${seg("etf", r.etf, "via vos FNB", r)}</span>
        <span class="num"><b>${pct(r.weight)}</b></span><span class="num c">${cad(r.value_cad)}</span></summary>
        <div class="tbl parts"><table><thead><tr><th>Provient de</th><th>Comment</th><th class="r">Part du portefeuille</th><th class="r">Montant</th></tr></thead>
        <tbody>${r.parts.map(p => `<tr><td>${esc(p.label)}</td><td>${p.how}</td><td class="r">${pct(p.weight, 2)}</td><td class="r">${cad(p.weight * e.value_cad)}</td></tr>`).join("")}</tbody></table></div></details>`).join("");
    const unc = names ? sn.uncovered : (e.dimensions[tab].uncovered || []);
    const notes = [];
    if (names) notes.push(`Minimum seulement : pour chaque FNB, seules ses principales positions publiées par l'émetteur sont comptées${Object.keys(sn.etf_listed).length ? " (part du FNB couverte : " + Object.entries(sn.etf_listed).map(([k, v]) => esc(k) + " " + pct(v, 0)).join(", ") + ")" : ""}. L'exposition réelle à chaque entreprise peut être plus élevée.`);
    if (unc.length) notes.push(`Non ventilé, faute de données de l'émetteur : ${unc.map(esc).join(", ")}. Ces FNB restent dans leur propre catégorie.`);
    if (tab === "currency") notes.push("Devise de cotation du titre. Un FNB coté en dollars canadiens peut détenir des actifs étrangers.");
    const srcs = e.sources || [], dates = [...new Set(srcs.map(x => x.as_of))].sort();
    return `<section class="card expo" id="exposure"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3>Exposition réelle, FNB ventilés</h3><span class="small">valeur : ${cad(e.value_cad)}</span></div>
      <p class="small" style="margin-top:6px">Ce que le portefeuille détient vraiment : chaque FNB est réparti selon les pondérations publiées par son émetteur. Ouvrez une ligne pour voir de quels placements elle vient. Information seulement, jamais une recommandation.</p>
      <div class="ftabs" role="tablist" aria-label="Dimensions d'exposition" style="margin-top:12px">${XTABS.map(([k, t]) => `<button type="button" role="tab" aria-selected="${k === tab}" data-expo="${k}">${t}</button>`).join("")}</div>
      <div class="legend" style="margin-top:12px"><span><i class="seg-direct"></i>Détenu directement</span><span><i class="seg-etf"></i>Via vos FNB</span></div>
      <div role="tabpanel" style="margin-top:6px">${list || '<p class="small">Aucune donnée.</p>'}</div>
      ${notes.map(n => `<p class="small" style="margin-top:8px">${n}</p>`).join("")}
      ${srcs.length ? `<details style="margin-top:10px"><summary class="small" style="cursor:pointer">Sources des pondérations (${dates.length === 1 ? "au " + esc(dates[0]) : "au " + esc(dates[0]) + " – " + esc(dates[dates.length - 1])})</summary><ul class="small" style="margin-top:6px">${srcs.map(x => `<li>${esc(x.etf)} · ${esc(x.file.replace("data/meta/", ""))} · au ${esc(x.as_of)} · <a href="${esc(x.source_url)}" target="_blank" rel="noopener">${esc(new URL(x.source_url).hostname)}</a></li>`).join("")}</ul></details>` : ""}
    </section>`;
  }
  function renderLookthrough(rep) {
    const ids = [...new Set((rep.unknowns || []).filter(u => String(u.message_key).includes("etf") || String(u.message_key).includes("broad")).map(u => u.id))].sort();
    if (!rep.metrics_current.lookthrough) {
      return `<section class="card lt" id="lookthrough"><h3>Exposition sectorielle des FNB</h3>
        <p style="margin-top:6px">Les FNB ne sont pas ventilés par secteur (pas de look-through) : leur exposition par secteur n'est pas regardée à l'intérieur du FNB. Les parties FNB des contrôles ${esc(ids.join(", "))} sont donc <b>inconnues</b>. Elles sont listées dans « Ce qu'on ne peut pas vérifier » et ne changent pas le verdict.</p></section>`;
    }
    return `<section class="card lt" id="lookthrough"><h3>Exposition sectorielle des FNB</h3><p style="margin-top:6px">Les FNB sont ventilés par secteur (look-through disponible) : leur exposition est regardée à l'intérieur du FNB.</p></section>`;
  }
  const WHY = {
    employer_sector_etf_part_unknown: "la part des FNB n'est pas ventilée par secteur, le plafond de l'employeur ne peut pas être vérifié",
    sector_risk_broad_market_unknown: "le secteur « marché large » regroupe des FNB dont la composition est inconnue",
    excluded_activity_no_tag_rows: "aucune étiquette d'activité sourcée pour ce titre",
    excluded_activity_etf_no_lookthrough: "composition interne du FNB inconnue (pas de look-through)",
    excluded_activity_etf_constituents_unknown: "les titres du FNB ne sont pas étiquetés",
    fee_unknown: "frais non disponibles", theme_weight_unknown: "thèmes non disponibles",
  };
  function renderUnknowns(rep) {
    const list = rep.unknowns || [], groups = new Map();
    list.forEach((u, i) => { const k = u.id + "|" + u.message_key; if (!groups.has(k)) groups.set(k, {first: i, u, subjects: []}); if (u.subject) groups.get(k).subjects.push(u.subject); });
    const items = [...groups.values()].map(gr => `<li><div class="unkrow" data-check="u:${gr.first}" tabindex="0" role="button" aria-expanded="false">${st("unknown")} <b>${esc(gr.u.id)}</b> ${esc((CHECK[gr.u.id] || [gr.u.id])[0])} : ${esc(WHY[gr.u.message_key] || gr.u.message_key)}${gr.subjects.length ? ` <span class="small">(${gr.subjects.map(esc).join(", ")})</span>` : ""}</div><div id="chain-u-${gr.first}" class="chainslot" hidden></div></li>`).join("");
    return `<section class="card" id="unknowns"><h3>Ce qu'on ne peut pas vérifier</h3>
      ${list.length ? `<p class="small" style="margin-top:6px">Ces contrôles n'ont pas pu être décidés faute de données. Ils sont listés à part et ne changent pas le verdict. Cliquez pour voir d'où ils viennent.</p><ul class="unklist">${items}</ul>` : `<p class="small" style="margin-top:6px">Tout a pu être vérifié.</p>`}</section>`;
  }
  function renderLimitations(rep) {
    const all = rep.assumptions || [];
    const pick = keys => all.filter(a => keys.some(k => a.toLowerCase().includes(k)));
    const groups = [

  /* ---------- SPEC §12 routes: the one POST helper, N3 decision, B2 intent form (nothing here sends a limit or an AI output) ---------- */
  function apiBase() {
    const meta = document.querySelector('meta[name="coherence-api-base"]');
    const set = (typeof window !== "undefined" && window.COHERENCE_API_BASE) || (meta ? meta.content : "") || "";
    return String(set).trim().replace(/\/+$/, "");
  }
  async function apiPost(path, body, verb) {
    const base = apiBase();
    if (!base) throw new Error("Aucune API configurée");
    const res = await fetch(base + path, {method: verb || "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
    if (!res.ok) throw new Error("API : HTTP " + res.status);
    return res.json();
  }
  async function decideRule(action, index) {
    if (!apiBase() || (action !== "approve" && action !== "reject")) return;
    const approved = action === "approve";
    let rule = null, max_pct = null;
    state.rep.sections.forEach(s => { const d = (s.facts.derived || {})["values.parsed_notes"]; if (!rule && d && d.value && d.value[index]) rule = d.value[index]; });
    /* §16 Amira: a theme rule written without a number is not approved blindly; the page asks for the number and sends it. A rejection records no limit. */
    if (approved && rule && rule.rule_kind === "max_theme_weight" && typeof (rule.params || {}).max_pct !== "number") {
      const typed = prompt(`Vous avez écrit « ${rule.quote} ». Quelle part maximale du portefeuille (en %) voulez-vous pour ce thème?`);
      if (typed === null) return;
      max_pct = Number(String(typed).trim().replace(",", "."));
      if (!Number.isFinite(max_pct) || !(max_pct > 0 && max_pct <= 100)) {
        state.error = "La décision n'a pas été enregistrée : la part maximale doit être un nombre supérieur à 0 et au plus 100.";
        render();
        return;
      }
    }
    const decision = {approved};
    if (max_pct !== null) decision.max_pct = max_pct;
    try {
      await apiPost(`/profiles/${state.rep.profile_id}/parsed-rules/${index}/decision`, decision);
      state.rep.sections.forEach(s => { const d = (s.facts.derived || {})["values.parsed_notes"], r = d && d.value ? d.value[index] : null;
        if (r) { r.approved_by_user = approved; if (max_pct !== null) r.params = Object.assign({}, r.params, {max_pct}); } });
      state.error = "";
    } catch (e) { state.error = "La décision n'a pas été enregistrée (" + e.message + ")."; }
    render();
    if (!state.error) loadIntake();
  }
  /* ---------- Intake (SPEC §12, §20.6): fixed questions from GET /profiles/{id}/intake; the static demo lists what is missing, read-only ---------- */
  /* The profile the intake belongs to: the one being set up (no report yet), else the one of the open report. */
  function currentProfileId() {
    if (state.onboarding) return state.onboarding.profile_id;
    return state.rep ? state.rep.profile_id : "";
  }
  async function loadIntake() {
    const profile_id = currentProfileId();
    if (!apiBase() || !profile_id) return;
    try {
      const r = await fetch(apiBase() + "/profiles/" + profile_id + "/intake");
      if (!r.ok) throw new Error("API : HTTP " + r.status);
      state.intake = await r.json();
    } catch (e) { state.error = "La liste des points à préciser n'a pas été chargée (" + e.message + ")."; }
    render();
  }
  async function answerIntake(path, value) {
    if (!apiBase()) return;
    let given = String(value == null ? "" : value).trim();
    if (!given) return;
    if (path.endsWith(".max_pct")) {
      /* a theme share is a JSON number in (0, 100] */
      given = Number(given.replace(",", "."));
      if (!Number.isFinite(given) || !(given > 0 && given <= 100)) { state.error = "La réponse n'a pas été enregistrée : la part maximale doit être un nombre supérieur à 0 et au plus 100."; render(); return; }
    } else if (given === "true" || given === "false" || "[{-0123456789".includes(given[0])) {
      try { given = JSON.parse(given); } catch (e) { /* stays the text the user typed */ }
    } else if ((path.includes("prefers_") || path.endsWith("home_bias_ok")) && ["oui", "yes", "non", "no"].includes(given.toLowerCase())) {
      given = ["oui", "yes"].includes(given.toLowerCase());
    }
    try {
      await apiPost(`/profiles/${currentProfileId()}/intake/answer`, {path, value: given});
      state.error = "";
    } catch (e) { state.error = "La réponse n'a pas été enregistrée (" + e.message + ")."; }
    await loadIntake();
    render();
  }
  async function skipIntake(path) {
    if (!apiBase()) return;
    try {
      await apiPost(`/profiles/${currentProfileId()}/intake/skip`, {path});
      state.error = "";
    } catch (e) { state.error = "La question n'a pas été passée (" + e.message + ")."; }
    await loadIntake();
    render();
  }
  function renderIntake(rep) {
    if (apiBase()) {
      if (!state.intake) return `<p class="small" style="margin-top:12px">Chargement des points à préciser…</p>`;
      const all = Object.values(state.intake), left = all.reduce((n, x) => n + (x.missing || []).length, 0), q = all.map(x => x.next_question).find(Boolean);
      if (!q) return `<p class="small" style="margin-top:12px">Rien à préciser : chaque question du profil a une réponse ou a été passée.</p>`;
      return `<form id="intake-form" class="ifm" data-path="${esc(q.path)}">
        <p class="small full">Il reste ${left} point${left > 1 ? "s" : ""} à préciser. Une question à la fois; une question passée reste « non vérifiable ».</p>

    }
    const block = rep.intake || (rep.site && rep.site.intake);
    if (!block) return "";
    const rows = Object.entries(block).map(([f, e]) => [f, Array.isArray(e) ? e : (e && e.missing) || []]).filter(([, m]) => m.length);
    const title = f => (rep.sections.find(s => s.factor === f) || {}).title || f;

  /* The `site` block the renderers read, built from the API data only: the report (stress block: portfolio value and date; drivers: weights)
     and the profile (identity, limits and their trace, computed by the API's rules, never by the page). */
  function buildLiveSite(rep, profile) {
    const val = x => x && typeof x === "object" && "value" in x ? x.value : x;
    const who = profile.identity || {}, risk = profile.risk || {}, obj = profile.objectives || {}, sit = profile.situation || {};
    const listed = state.profiles.find(p => p.profile_id === rep.profile_id);
    const name = (listed && listed.name) || who.name || (profile.meta || {}).display_name || rep.profile_id;
    const weights_pct = {};
    ((rep.metrics_current || {}).drivers || []).forEach(d => { if (d.weight > 0) weights_pct[d.ticker] = d.weight * 100; });
    const limits = {};
    Object.entries(profile.limits || {}).forEach(([k, v]) => { if (!k.startsWith("_") && k !== "by") limits[k] = v; });
    const held = rep.stress || {};
    return {
      label: `${name} · portefeuille actuel`, as_of: held.as_of, value_cad: held.value_cad, portfolio_file: rep.portfolio_id, whatif: false,
      weights_pct, limits, limits_trace: profile.limits_trace || {},
      profile_card: {name, age: who.age == null ? "—" : who.age, occupation: who.occupation || "—", life_stage: val(who.life_stage),
        risk_declared: risk.declared, risk_capacity: val(risk.capacity), risk_effective: val(risk.effective),
        horizon_years: obj.horizon_years, effective_horizon_years: val(obj.effective_horizon_years),
        first_withdrawal: (sit.planned_withdrawals || [{}])[0] || {}, emergency_fund_months: val(sit.emergency_fund_months),
        goals: obj.goals || [], notes: (profile.values || {}).notes || ""},

  }
  /* POST /profiles/{id}/review takes no body: the API reads the profile and the portfolio it holds. */

  /* The body is exactly `{as_of, value_cad, weights_pct}` (percent by ticker); the verb goes through apiPost's third argument. */
  async function savePortfolio(form) {
    if (!apiBase()) return;
    const id = currentProfileId();
    const weights = {};
    let sum = 0;
    form.querySelectorAll(".wrow").forEach(row => {
      const ticker = row.querySelector('[name="ticker"]').value.trim().toUpperCase();
      const w = Number(String(row.querySelector('[name="weight_pct"]').value).trim().replace(",", "."));
      if (ticker && Number.isFinite(w) && w > 0) { weights[ticker] = (weights[ticker] || 0) + w; sum += w; }
    });
    const value = Number(String(form.elements.value_cad.value).trim().replace(",", "."));
    const as_of = form.elements.as_of.value;
    if (!as_of || !Number.isFinite(value) || !(value > 0) || !Object.keys(weights).length || Math.abs(sum - 100) > 0.01) {
      state.error = "Le portefeuille n'a pas été enregistré : indiquez la date, une valeur supérieure à zéro et des poids qui totalisent 100 %.";
      render();
      return;
    }
    const portfolio = {as_of, value_cad: value, weights_pct: weights};
    try {
      await apiPost(`/profiles/${id}/portfolio`, portfolio, "put");
      state.onboarding = null;
      state.error = "";
    } catch (e) {
      state.error = "Le portefeuille n'a pas été enregistré (" + e.message + ").";
      render();
      return;
    }
    await loadLiveReview(id);
  }

  /* B2: the body is exactly what api.ConfirmIn accepts (ticker, target_weight_pct, funding); nothing is copied from the draft or the report. */
  async function confirmIntent(form) {

  function cone(rep) {

  function factorPage(rep) {

  /* ---------- Recherche (search and ask) ---------- */
  const CLS = {etf: "FNB (tous)", equity: "Action", etf_equity: "FNB d'actions", etf_bond: "FNB d'obligations", etf_commodity: "FNB or", crypto: "Crypto"};
  const MKT = {us: ["États-Unis", a => ["NASDAQ", "NYSE", "NYSE Arca", "Cboe BZX"].includes(a.market)],
               ca: ["Canada", a => a.market === "TSX"], cx: ["Crypto (24/7)", a => a.market.startsWith("Crypto")]};
  const SEC = {tech: ["Technologie", a => a.sector === "Information Technology" || /tech/i.test(a.sector)],
               fin: ["Finance", a => a.sector === "Financials"], nrg: ["Énergie", a => a.sector === "Energy"],
               hea: ["Santé", a => a.sector === "Health Care"], con: ["Consommation", a => a.sector.startsWith("Consumer")],
               utl: ["Services publics", a => a.sector === "Utilities"], ind: ["Industrie", a => a.sector === "Industrials"],
               com: ["Communication", a => a.sector === "Communication Services"], bnd: ["Obligations", a => a.sector.startsWith("Bonds")],
               brd: ["Marché large", a => a.sector.startsWith("Broad")], gld: ["Or", a => a.sector === "Gold"], cry: ["Crypto", a => a.sector === "Crypto asset"]};
  const KW = [
    [/\b(fnb|etf)s?\b/, "cls", ["etf"]], [/\b(actions?|stocks?|titres?|entreprises?|compan)/, "cls", ["equity"]],
    [/obligation|\bbonds?\b|revenu fixe/, "cls", ["etf_bond"]], [/crypto|bitcoin|ether/, "cls", ["crypto"]], [/\bgold\b|\bl'or\b|metaux|métaux/, "cls", ["etf_commodity"]],
    [/americ|améric|etats-unis|états-unis|\bus\b|\busa\b|nasdaq|nyse/, "mkt", ["us"]], [/canad|\btsx\b/, "mkt", ["ca"]],
    [/tech|logiciel|software|semi/, "sec", ["tech"]], [/banque|bank|financ|assur/, "sec", ["fin"]], [/energ|énerg|petrol|pétrol|\boil\b|pipeline/, "sec", ["nrg"]],
    [/sante|santé|health|pharma/, "sec", ["hea"]], [/consomm|consumer|detail|détail/, "sec", ["con"]], [/services publics|utilit|électri|electri/, "sec", ["utl"]],
    [/industri|rail|transport/, "sec", ["ind"]], [/communication|media|média/, "sec", ["com"]], [/marche large|marché large|indice|index|broad/, "sec", ["brd"]],
    [/\busd\b|dollars? americ|dollars? améric/, "ccy", ["USD"]], [/\bcad\b|dollars? canad/, "ccy", ["CAD"]],
  ];
  const REFUSE = /meilleur|\bbest\b|recommand|recommend|conseill|devrais|should i|lequel (choisir|prendre|acheter)|which (one|is)|\btop\b|acheter|vendre|\bbuy\b|\bsell\b/;
  const FIT = /convien|cadre|fit|compatible|coh[eé]ren|simul|what.?if|analys/;
  const deacc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const askState = {filters: {cls: new Set(), mkt: new Set(), sec: new Set(), ccy: new Set()}, sel: new Set(),
    chat: [{who: "agent", text: "Décrivez ce que vous cherchez (par exemple « actions technologiques américaines » ou « seulement les FNB canadiens ») et j'applique les filtres. Je peux aussi tester un actif que vous choisissez contre le profil. Je ne classe ni ne recommande d'actifs."}]};
  let universe = null;
  async function loadUniverse() { if (!universe) universe = await (await fetch("reports/" + state.rep.site.whatif.universe)).json(); return universe; }
  const match = a => { const f = askState.filters;
    return (!f.cls.size || f.cls.has(a.asset_class) || (f.cls.has("etf") && a.asset_class.startsWith("etf"))) && (!f.mkt.size || [...f.mkt].some(k => MKT[k][1](a)))
      && (!f.sec.size || [...f.sec].some(k => SEC[k][1](a))) && (!f.ccy.size || f.ccy.has(a.currency)); };
  const findTickers = (q, assets) => assets.filter(a => { const t = a.ticker.toLowerCase(), b = t.replace(/\.to$|-usd$/, "");
    return new RegExp(`(^|[^a-z0-9.])(${b.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})(\\.to|-usd)?($|[^a-z0-9])`).test(q) || (a.name.length > 4 && q.includes(deacc(a.name).split(/[ ,]/)[0]) && deacc(a.name).split(/[ ,]/)[0].length > 4); });
  function respond(text) {
    const q = deacc(text), assets = universe.assets, f = askState.filters;
    if (REFUSE.test(q)) return {kind: "refuse", text: "Je ne peux pas classer ni recommander d'actifs. Je peux ajouter des filtres pour réduire la liste, ou analyser la cohérence des actifs que vous choisissez vous-même."};
    if (/efface|reinitialis|clear|tout enlever|recommence/.test(q)) { Object.values(f).forEach(s => s.clear()); return {text: `Filtres effacés. Les ${assets.length} actifs de l'univers sont affichés.`}; }
    const named = findTickers(q, assets);
    if (named.length && FIT.test(q)) { named.forEach(a => askState.sel.add(a.ticker)); return {text: `Je lance l'analyse de cohérence pour ${named.map(a => a.ticker).join(", ")}. Le profil sert seulement à vérifier, pas à choisir.`, go: named.map(a => a.ticker)}; }
    const only = /seulement|uniquement|only|juste/.test(q), add = /ajoute|aussi|\badd\b|inclu/.test(q);
    const hits = {};
    for (const [re, dim, vals] of KW) if (re.test(q)) (hits[dim] = hits[dim] || new Set()), vals.forEach(v => hits[dim].add(v));
    if (hits.cls && hits.cls.has("etf_bond") && hits.cls.has("etf")) hits.cls.delete("etf");
    if (!Object.keys(hits).length) {
      if (named.length) { named.forEach(a => askState.sel.add(a.ticker)); return {text: `J'ai coché ${named.map(a => a.ticker).join(", ")} dans la liste. Cliquez « Analyser la cohérence » pour voir l'effet sur le portefeuille.`}; }
      return {text: "Je n'ai pas reconnu de filtre. Essayez une catégorie (actions, FNB, obligations, crypto), un marché (canadien, américain), un secteur (technologie, énergie, finance…) ou un symbole."};
    }
    for (const [dim, vals] of Object.entries(hits)) { if (!add || only) f[dim].clear(); vals.forEach(v => f[dim].add(v)); }
    const n = assets.filter(match).length, nf = Object.values(f).reduce((s, x) => s + x.size, 0);
    return {text: `J'ai appliqué ${nf} filtre${nf > 1 ? "s" : ""} à l'univers de ${assets.length} actifs. ${n} actif${n > 1 ? "s" : ""} correspond${n > 1 ? "ent" : ""}. La liste est triée de A à Z et n'est pas une recommandation.`};
  }
  function chips() {
    const f = askState.filters, out = [];
    f.cls.forEach(v => out.push(["cls", v, "Catégorie : " + CLS[v]])); f.mkt.forEach(v => out.push(["mkt", v, "Marché : " + MKT[v][0]]));
    f.sec.forEach(v => out.push(["sec", v, "Secteur : " + SEC[v][0]])); f.ccy.forEach(v => out.push(["ccy", v, "Devise : " + v]));
    return out;
  }

        <p class="sub" style="margin-top:6px;max-width:70ch">Décrivez ce que vous cherchez et les filtres s'appliquent. Choisissez ensuite des actifs dans la liste pour voir comment ils changeraient le portefeuille et sa cohérence.</p></div>

            : `<div class="msg agent ${m.kind === "refuse" ? "refuse" : ""}"><span class="who">${m.kind === "refuse" ? "Agent · hors de ce que je peux faire" : "Agent"}</span>${esc(m.text)}</div>`).join("")}</div>
          <div class="sugg">${["Actions technologiques américaines", "Seulement les FNB", "Ajoute les titres canadiens", "Lequel est le meilleur pour moi?", "NVDA convient-il à mon profil?"].map(s => `<button type="button" data-ask="${esc(s)}">${esc(s)}</button>`).join("")}</div>
          <form id="askf" class="askf"><label for="askq">Posez une question sur un actif, ou décrivez votre recherche</label>

          <div class="fchips">${chips().map(([d, v, l]) => `<span class="fchip">${esc(l)}<button type="button" aria-label="Retirer ${esc(l)}" data-rm="${d}:${esc(v)}">✕</button></span>`).join("")}
            <select id="addf" aria-label="Ajouter un filtre"><option value="">+ Ajouter un filtre</option><optgroup label="Catégorie">${opt("cls", CLS)}</optgroup><optgroup label="Marché">${opt("mkt", MKT)}</optgroup><optgroup label="Secteur">${opt("sec", SEC)}</optgroup><optgroup label="Devise"><option value="ccy:CAD">CAD</option><option value="ccy:USD">USD</option></optgroup></select></div>
          <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:14px 0 6px"><span class="small"><b style="color:var(--ink)">${list.length} sur ${universe.assets.length} actifs</b> correspondent</span><span class="small">Triés de A à Z. L'ordre n'est pas un classement.</span></div>

            || `<tr><td colspan="7" class="small">Aucun actif ne correspond. Retirez un filtre.</td></tr>`}</tbody></table></div>
          <div class="selbar"><b>${sel.size} actif${sel.size > 1 ? "s" : ""} choisi${sel.size > 1 ? "s" : ""}</b><button class="cta" type="button" id="analyse" ${sel.size ? "" : "disabled"}>Analyser la cohérence</button></div>

  }
  function bindRecherche() {
    const send = text => { if (!text.trim() || !universe) return; askState.chat.push({who: "user", text}); const r = respond(text); askState.chat.push({who: "agent", ...r});
      if (r.go) { wi.tickers = r.go; wi.cur = r.go[0]; go("simulation"); } else { render(); const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight; $("#askq")?.focus(); } };
    $("#askf")?.addEventListener("submit", e => { e.preventDefault(); send($("#askq").value); });
    document.querySelectorAll("[data-ask]").forEach(b => b.addEventListener("click", () => send(b.dataset.ask)));
    document.querySelectorAll("[data-sel]").forEach(c => c.addEventListener("change", () => { c.checked ? askState.sel.add(c.dataset.sel) : askState.sel.delete(c.dataset.sel); render(); }));
    document.querySelectorAll("[data-rm]").forEach(b => b.addEventListener("click", () => { const [d, v] = b.dataset.rm.split(/:(.*)/); askState.filters[d].delete(v); render(); }));
    $("#addf")?.addEventListener("change", e => { const [d, v] = e.target.value.split(/:(.*)/); if (d) askState.filters[d].add(v); render(); });
    $("#clearf")?.addEventListener("click", () => { Object.values(askState.filters).forEach(s => s.clear()); render(); });
    $("#analyse")?.addEventListener("click", () => { wi.tickers = [...askState.sel].sort(); wi.cur = wi.tickers[0]; go("simulation"); });
    const m = $("#msgs"); if (m) m.scrollTop = m.scrollHeight;
  }

  /* ---------- Simulation (what-if) ---------- */
  const wi = {tickers: [], cur: null, target: 10, funding: null, cache: {}};
  let wiAll = null;
  async function loadWhatif(t) { if (!wiAll) wiAll = await (await fetch("reports/" + state.rep.site.whatif.scenarios)).json(); wi.cache[t] = wiAll[t] || {asset: {ticker: t, name: t, held_pct: 0}, scenarios: {}}; return wi.cache[t]; }
  const ORDER = ["violation", "warning", "unknown", "info", "pass"];
  function wiCone(base, sc, floor, v0) {
    const n = sc.cone.p50.length, W = 720, H = 300, L = 54, R = 150, T = 16, B = 30;
    const all = [...sc.cone.p5, ...sc.cone.p95, ...base.cone.p50, floor, v0];
    const lo = Math.floor(Math.min(...all) / 50000) * 50000, hi = Math.ceil(Math.max(...all) / 50000) * 50000;
    const x = i => L + (i / n) * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
    const line = a => [`${x(0)},${y(v0)}`, ...a.map((v, i) => `${x(i + 1).toFixed(1)},${y(v).toFixed(1)}`)];
    const band = (a, b) => `M${line(a).join(" L")} L${line(b).reverse().join(" L")} Z`;
    let g = "";
    for (let v = lo; v <= hi; v += 50000) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line-2)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${kcad(v)}</text>`;
    for (let k = 0; k <= Math.round(n / 12); k++) g += `<text x="${x(Math.min(k * 12, n))}" y="${H - 8}" text-anchor="middle">${k ? "An " + k : "Auj."}</text>`;
    g += `<path d="${band(sc.cone.p95, sc.cone.p5)}" fill="var(--band)"/><path d="${band(sc.cone.p75, sc.cone.p25)}" fill="var(--band-2)"/>`;
    g += `<line x1="${L}" x2="${W - R}" y1="${y(floor)}" y2="${y(floor)}" stroke="var(--red)" stroke-width="1.5" stroke-dasharray="6 5"/><text x="${L + 6}" y="${y(floor) - 7}" style="fill:var(--red-ink);font-weight:700">Plancher ${kcad(floor)}</text>`;
    g += `<polyline points="${line(base.cone.p50).join(" ")}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="5 4"/>`;
    g += `<polyline points="${line(sc.cone.p50).join(" ")}" fill="none" stroke="var(--navy)" stroke-width="2.5"/><polyline points="${line(sc.cone.p5).join(" ")}" fill="none" stroke="var(--red)" stroke-width="1.5"/>`;
    const e = (v, lab, col, dy = 4) => `<circle cx="${x(n)}" cy="${y(v)}" r="4" fill="${col}"/><text x="${x(n) + 10}" y="${y(v) + dy}" style="fill:${col};font-weight:700">${lab} ${kcad(v)}</text>`;
    const bm = base.cone.p50[n - 1], am = sc.cone.p50[n - 1], close = Math.abs(y(bm) - y(am)) < 14;
    g += e(sc.cone.p95[n - 1], "Optimiste", "var(--muted)") + e(am, "Médiane ajustée", "var(--navy)", close && am >= bm ? -4 : 4) + e(bm, "Médiane actuelle", "var(--muted)", close ? (am >= bm ? 14 : -6) : 4) + e(sc.cone.p5[n - 1], "Pessimiste", "var(--red-ink)");
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Projection ajustée">${g}</svg>`;
  }
  function pageSimulation() {
    if (!state.rep.site.whatif) return whatifNote();
    if (!universe) { loadUniverse().then(render); return `<p class="sub">Chargement…</p>`; }
    const base = universe.base;
    if (!wi.tickers.length) { wi.tickers = ["NVDA"]; wi.cur = "NVDA"; }
    if (!wi.funding) wi.funding = base.fundings[base.fundings.length - 1].id;
    const d = wi.cache[wi.cur];
    if (!d) { loadWhatif(wi.cur).then(render); return `<p class="sub">Chargement du scénario…</p>`; }
    const a = d.asset, sc = d.scenarios[`${wi.target}|${wi.funding}`], L = state.rep.site.limits, v0 = base.value_cad;
    const fundLabel = (base.fundings.find(f => f.id === wi.funding) || {}).label;
    const head = `<div><button class="link" type="button" data-go="recherche">‹ Retour aux résultats de recherche</button>
        <p class="eyebrow" style="margin-top:14px">Simulation</p><h1 style="margin-top:6px">Cet actif cadrerait-il avec le profil de ${esc(state.rep.site.profile_card.name)}?</h1></div>
      ${wi.tickers.length > 1 ? `<div class="atabs" role="tablist">${wi.tickers.map(t => `<button type="button" role="tab" aria-selected="${t === wi.cur}" data-wi="${esc(t)}">${esc((universe.assets.find(x => x.ticker === t) || {}).name || t)} <span class="mono">${esc(t)}</span></button>`).join("")}</div>` : ""}
      <section class="card scen-bar"><div class="kv"><span>Actif</span><b>${esc(a.name)} <span class="mono">${esc(a.ticker)}</span></b></div>
        <div class="kv"><span>Scénario</span><b>Porter à une part du portefeuille actuel${a.held_pct ? ` (détenu : ${pct(a.held_pct / 100, 0)})` : ""}</b></div>
        <div class="kv"><label for="wit">Part visée</label><select id="wit">${base.targets.map(t => `<option value="${t}" ${t === wi.target ? "selected" : ""}>${t} % · ${cad(t / 100 * v0)}</option>`).join("")}</select></div>
        <div class="kv"><label for="wif">Financé par</label><select id="wif">${base.fundings.map(f => `<option value="${esc(f.id)}" ${f.id === wi.funding ? "selected" : ""}>${esc(f.label)}</option>`).join("")}</select></div></section>`;
    if (!sc || sc.error) return `<div class="page">${head}<section class="card"><h3>Scénario impossible</h3><p class="sub" style="margin-top:6px">${esc(sc ? sc.error : "Aucun scénario précalculé.")} Changez la part visée ou le financement.</p></section></div>`;
    const bm = base.metrics, m = sc.metrics;
    const V = {coherent: ["pass", "Cadre avec le profil"], coherent_with_warnings: ["warning", "Cadre, avec avertissements"], incoherent: ["violation", "Ne cadre pas avec le profil"]};
    const worse = sc.sections.filter(s => ORDER.indexOf(s.after) < ORDER.indexOf(s.before)), better = sc.sections.filter(s => ORDER.indexOf(s.after) > ORDER.indexOf(s.before));
    const lead = `Porter ${esc(a.name)} à ${wi.target} % du portefeuille fait passer la valeur pessimiste de ${cad(bm.p5_T)} à ${cad(m.p5_T)} (plancher ${cad(L.floor_at_horizon)}) et la volatilité de ${pct(bm.vol)} à ${pct(m.vol)} (bande ${pct(L.vol_band_annual[0], 0)} à ${pct(L.vol_band_annual[1], 0)}).`
      + (worse.length ? ` Facteur${worse.length > 1 ? "s" : ""} qui se dégrade${worse.length > 1 ? "nt" : ""} : ${worse.map(s => s.title.toLowerCase()).join(", ")}.` : " Aucun facteur ne se dégrade.")
      + (better.length ? ` S'améliore : ${better.map(s => s.title.toLowerCase()).join(", ")}.` : "");
    const cnt = st => { const c = {}; st.forEach(s => c[s] = (c[s] || 0) + 1); return [`${c.pass || 0} aligné${(c.pass || 0) > 1 ? "s" : ""}`, c.violation ? `${c.violation} hors limites` : "", c.warning ? `${c.warning} avertissement${c.warning > 1 ? "s" : ""}` : "", c.unknown ? `${c.unknown} à vérifier` : ""].filter(Boolean).join(", "); };
    const vb = V[base.verdict], va = V[sc.verdict];
    const row = (lab, b, x, bad, fmt) => `<tr><td>${lab}</td><td class="r">${fmt(b)}</td><td class="r"><b class="${bad ? "tx-violation" : ""}">${fmt(x)}</b></td></tr>`;
    const arrow = s => `<span class="small">${PILLAR[s.before]}</span> → ${st(s.after, PILLAR[s.after] + (s.after === s.before ? (s.after === "pass" ? "" : ", inchangé") : ""))}`;
    return `<div class="page">${head}
      <section class="card exec"><div><h2 class="tx-${va[0]}" style="display:flex;gap:10px;align-items:center">${ICON[va[0]]} ${va[1]}</h2>
          <p class="lead" style="margin-top:10px">${lead}</p>
          <p class="sub" style="margin-top:10px">Ceci est une analyse de l'actif que vous avez choisi. Ce n'est pas une suggestion de l'acheter ou de l'éviter.</p></div>
        <div style="display:flex;flex-direction:column;gap:12px">
          <div class="qbox"><span class="q">Portefeuille aujourd'hui</span><span class="a tx-${vb[0]}">${vb[1]}</span><span class="small">${cnt(sc.sections.map(s => s.before))}</span></div>
          <div class="qbox"><span class="q">Avec cet actif</span><span class="a tx-${va[0]}">${va[1]}</span><span class="small">${cnt(sc.sections.map(s => s.after))}</span></div></div></section>
      <div class="grid2">
        <section class="card chart"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline"><h3>Projection ajustée</h3><span class="small">${Math.round(sc.cone.p50.length / 12)} ans, CAD</span></div>
          <div style="margin-top:10px">${wiCone(base, sc, L.floor_at_horizon, v0)}</div>
          <div class="legend"><span><i style="background:var(--band)"></i>P5 à P95</span><span><i style="background:var(--band-2)"></i>P25 à P75</span><span><i style="background:var(--navy);height:3px"></i>Médiane avec l'actif</span><span><i style="border-top:2px dashed var(--muted);height:0"></i>Médiane actuelle</span><span><i style="background:var(--red);height:3px"></i>Pessimiste (P5)</span></div>
          <p class="small" style="margin-top:10px">Trait plein : portefeuille avec l'actif. Pointillé : portefeuille actuel. Même moteur, même graine, mêmes données que le rapport.</p></section>
        <section class="card"><h3>Avant et après</h3><div class="tbl" style="margin-top:8px"><table><thead><tr><th>Mesure</th><th class="r">Aujourd'hui</th><th class="r">Avec l'actif</th></tr></thead><tbody>
          ${row("Valeur médiane à l'horizon", bm.p50_T, m.p50_T, false, cad)}${row("Valeur pessimiste (P5)", bm.p5_T, m.p5_T, m.p5_T < L.floor_at_horizon, cad)}
          ${row("Volatilité annuelle", bm.vol, m.vol, m.vol > L.vol_band_annual[1], pct)}${row("Pire repli historique", bm.mdd, m.mdd, m.mdd < L.max_drawdown_pct / 100, pct)}
          ${row("Probabilité de perte", bm.loss_prob, m.loss_prob, false, pct)}${row("Part en actions individuelles", base.shares.single_stocks, sc.shares.single_stocks, false, x => pct(x, 0))}
          ${row("Part en obligations", base.shares.bonds, sc.shares.bonds, sc.shares.bonds < L.min_fixed_income_weight, x => pct(x, 0))}</tbody></table></div>
          <p class="small" style="margin-top:10px">Financement : ${esc(fundLabel)}.</p></section></div>
      <h2>Cohérence avec cet actif</h2>
      <div class="half">${sc.sections.map(s => `<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h3>${esc(s.title)}</h3><span>${arrow(s)}</span></div>
        ${s.after === "pass" ? `<p class="sub" style="margin-top:10px">Aucun écart pour ce facteur avec cet actif.</p>` : `<ul class="segs" style="margin-top:12px">${s.segments.map(g => `<li>${segmentTag(g)}<div>${esc(g.text)}<span class="refs">${(g.refs || []).map(esc).join(", ")}</span></div></li>`).join("")}</ul>`}</section>`).join("")}</div>
      <div class="actions"><button class="primary" type="button" data-go="recherche">Tester un autre actif</button></div>
      <p class="small">Méthode : le portefeuille est recalculé avec les nouveaux poids (intent.apply), puis les mêmes vérifications et les cinq facteurs sont relancés. Chiffres calculés par le code; texte gabarit déterministe. Valeurs précalculées pour ${base.targets.join(" % et ")} % et ${base.fundings.length} modes de financement.</p></div>`;
  }
  function bindSimulation() {
    $("#wit")?.addEventListener("change", e => { wi.target = Number(e.target.value); render(); });
    $("#wif")?.addEventListener("change", e => { wi.funding = e.target.value; render(); });
    document.querySelectorAll("[data-wi]").forEach(b => b.addEventListener("click", () => { wi.cur = b.dataset.wi; render(); }));
  }

  /* ---------- shell ---------- */
  function render() {
    const rep = state.rep, setup = state.creating ? renderNewProfileForm() : state.onboarding ? renderOnboarding() : "";
    const errbar = state.error ? `<p class="errbar" role="alert">${esc(state.error)}</p>` : "";
    if (!rep && !setup) { if (errbar) $("#app").innerHTML = errbar; return; }
    if (setup) {
      $("#pages").innerHTML = "";
      $("#app").innerHTML = errbar + setup;
      const newForm = $("#new-profile-form");
      if (newForm) newForm.addEventListener("submit", e => { e.preventDefault(); createProfile(e.target); });
      const pfForm = $("#portfolio-form");
      if (pfForm) pfForm.addEventListener("submit", e => { e.preventDefault(); savePortfolio(e.target); });
      document.querySelectorAll("[data-portfolio]").forEach(b => b.addEventListener("click", () => {
        const box = $("#weight-rows"), row = box.firstElementChild.cloneNode(true);
        row.querySelectorAll("input").forEach(i => { i.value = ""; });
        box.appendChild(row);
      }));
    } else renderReport(rep, errbar);
    const intakeForm = $("#intake-form");
    if (intakeForm) intakeForm.addEventListener("submit", e => { e.preventDefault(); answerIntake(e.target.dataset.path, e.target.elements.answer.value); });
    document.querySelectorAll("[data-intake]").forEach(b => b.addEventListener("click", () => { if (b.dataset.intake === "skip") skipIntake(b.dataset.path); }));
  }
  function renderReport(rep, errbar) {
    const bad = rep.sections.some(s => s.status === "violation"), pcBad = rep.profile_coherence && rep.profile_coherence.findings.length;
    $("#pages").innerHTML = PAGES.map(([id, t]) => `<a href="#${id}" ${state.page === id ? 'aria-current="page"' : ""}>${t}${(id === "facteurs" && bad) || (id === "profil" && pcBad) ? '<span class="dot" aria-hidden="true"></span>' : ""}</a>`).join("");
    const body = {synthese: pageSynthese, facteurs: factorPage, profil: pageProfil, portefeuille: pagePortefeuille, recherche: pageRecherche, simulation: pageSimulation, sources: pageSources}[state.page](rep);
    $("#app").innerHTML = errbar + body;
    $("#foot").innerHTML = `<div class="wrap" style="display:flex;flex-direction:column;gap:4px"><b style="color:var(--navy)">${esc(rep.disclaimer)}</b><span>Aucune recommandation d'achat ou de vente. Rapport produit par <span class="mono">pipeline.review</span>, hors ligne, sorties d'IA enregistrées.</span></div>`;
    document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
    document.querySelectorAll("[data-factor]").forEach(b => b.addEventListener("click", () => { state.factor = b.dataset.factor; go("facteurs", true); }));
    document.querySelectorAll("[data-expo]").forEach(b => b.addEventListener("click", () => { state.expo = b.dataset.expo; render(); document.querySelector('[data-expo="' + state.expo + '"]')?.focus(); }));
    if (state.page === "recherche" && rep.site.whatif) bindRecherche();
    if (state.page === "simulation" && rep.site.whatif) bindSimulation();
    document.querySelectorAll("[data-action]").forEach(b => b.addEventListener("click", () => { if (apiBase()) decideRule(b.dataset.action, Number(b.dataset.index)); }));
    const draftForm = $("#draft-form");
    if (draftForm) draftForm.addEventListener("submit", e => { e.preventDefault(); requestDraft(e.target.elements.text.value); });
    const intentForm = $("#intent-form");
    if (intentForm) intentForm.addEventListener("submit", e => { e.preventDefault(); confirmIntent(e.target); });
    bindChecks(rep);
  }
  function go(page, keepFocus) {
    if (location.hash !== "#" + page) location.hash = page; else { state.page = page; render(); }
    if (!keepFocus) window.scrollTo(0, 0);
  }
  function route() {
    const h = location.hash.slice(1);
    state.page = PAGES.some(([id]) => id === h) ? h : "synthese";
    render();
    if (state.page === "facteurs") document.querySelector(`.ftabs [aria-selected="true"]`)?.focus({preventScroll: true});
  }
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });

  async function load(file) {
    try {
      const r = await fetch("reports/" + file);
      if (!r.ok) throw new Error("HTTP " + r.status);
      state.rep = await r.json(); state.factor = null; state.error = ""; state.draft = null; state.intake = null; state.onboarding = null; state.creating = false;
      resetWhatif();
      route(); loadIntake();
    } catch (e) { $("#app").innerHTML = `<p class="card">Impossible de charger le rapport ${esc(file)} (${esc(e.message)}). Rechargez la page.</p>`; }
  }
  try { const t = localStorage.getItem("ca-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $("#theme").addEventListener("click", () => {
    const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
    try { localStorage.setItem("ca-theme", document.documentElement.dataset.theme); } catch (e) {}
  });
  /* Entry point: with an API base the picker lists GET /profiles (seeds and users); without one it is the static demo (reports/index.json). */
  async function boot() {
    $("#pick").addEventListener("change", e => onPick(e.target.value));
    if (apiBase()) {
      await loadProfiles();
      if (state.profiles.length) { $("#pick").value = state.profiles[0].profile_id; loadLiveReview(state.profiles[0].profile_id); }
      else if (!state.error) onPick("new-profile");
      return;
    }
    try {
      const idx = await (await fetch("reports/index.json")).json();
      $("#pick").innerHTML = pickerStatic(idx);
      load(idx[0].file);
    } catch (e) { $("#app").innerHTML = `<p class="card">Impossible de charger la liste des rapports. Rechargez la page.</p>`; }
  }
  boot();
})();
</script>
</body>
